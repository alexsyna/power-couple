# Builds the Flutter web app and publishes it to GitHub Pages on every push
# to main. The Supabase URL and publishable key come from config/supabase.json
# (safe to publish; row-level security protects the data).
name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test

      # Served from https://<user>.github.io/<repo>/, so the base path is the repo name.
      - run: >
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define-from-file=config/supabase.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
